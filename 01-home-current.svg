<svg viewBox="0 0 360 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="360" height="720" fill="#F2F4F1"/>
  <rect x="0" y="0" width="360" height="64" fill="#14213D"/>
  <text x="20" y="40" fill="#FFFFFF" font-size="18" font-weight="bold">QuickBite</text>
  <circle cx="330" cy="32" r="14" fill="#3A4560"/>

  <rect x="20" y="84" width="320" height="40" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
  <text x="36" y="109" fill="#5B6472" font-size="13">Search restaurants...</text>

  <text x="20" y="150" fill="#14213D" font-size="14" font-weight="bold">Popular near you</text>
  <rect x="20" y="164" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#D4D9D6"/>
  <rect x="190" y="164" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#D4D9D6"/>
  <rect x="20" y="288" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#D4D9D6"/>
  <rect x="190" y="288" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#D4D9D6"/>

  <!-- Annotation: no reorder entry point -->
  <rect x="20" y="430" width="320" height="70" rx="6" fill="#FCEFDD" stroke="#E2963A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="32" y="454" fill="#92400e" font-size="12" font-weight="bold">⚠ No "reorder" entry point</text>
  <text x="32" y="472" fill="#92400e" font-size="11">Users must search from scratch every time,</text>
  <text x="32" y="486" fill="#92400e" font-size="11">even for repeat orders (see FR-01)</text>

  <text x="20" y="540" fill="#5B6472" font-size="11" font-style="italic">Current home screen — no reorder shortcut</text>
</svg>
